services:
  app:
    build: .
    restart: unless-stopped
    # uid:gid cua user tren may chu (kiem tra bang `id -u` va `id -g`) de file trong ./data thuoc user do
    user: "1000:1000"
    environment:
      TZ: Asia/Ho_Chi_Minh
      # user 1000 khong co thu muc home; gunicorn 26 ghi file dieu khien vao $HOME/.gunicorn
      HOME: /tmp
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
